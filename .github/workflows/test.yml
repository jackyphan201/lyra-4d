name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Generated files are current
        run: python tools/build.py --check
      - name: Unit tests (offline, fake upstreams)
        working-directory: tests
        run: python -m unittest -v
  macos-system-python:
    # the Python that ships with macOS (3.9 on current images), as most users run the installer with it
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 tools/build.py --check
      - name: Unit tests
        working-directory: tests
        run: /usr/bin/python3 -m unittest -v
